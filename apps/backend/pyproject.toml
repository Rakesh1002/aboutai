[tool.poetry]
name = "aboutai-backend"
version = "0.1.0"
description = "Autonomous AI content pipeline for aboutai platform"
readme = "README.md"
authors = ["aboutai <info@aboutai.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.12"

# Async HTTP Client
httpx = "^0.27.2"
aiohttp = "^3.10.10"

# Task Queue
celery = "^5.4.0"
redis = "^5.2.0"
flower = "^2.0.1"

# Data Validation
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"

# Database - Supabase
supabase = "^2.10.0"

# LLM & AI
langchain = "^0.3.7"
langchain-community = "^0.3.5"
langchain-openai = "^0.2.6"
langchain-anthropic = "^0.3.0"
openai = "^1.54.3"
anthropic = "^0.39.0"

# Browser Automation
playwright = "^1.48.0"

# Web Scraping
beautifulsoup4 = "^4.12.3"
feedparser = "^6.0.11"
python-dateutil = "^2.9.0"

# Content Processing
pyyaml = "^6.0.2"
markdown = "^3.7"

# Logging
structlog = "^24.4.0"

# Utilities
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
jinja2 = "^3.1.6"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.1.0"
ruff = "^0.1.14"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
